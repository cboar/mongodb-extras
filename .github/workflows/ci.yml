name: CI

on:
  # release.yml calls this workflow to verify pushes to main.
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, MongoDB ${{ matrix.mongodb-version }}, driver ${{ matrix.driver-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']
        mongodb-version: ['8.0', '7.0']
        driver-version: ['locked', '6.0.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongodb -p 127.0.0.1:27017:27017 mongo:${{ matrix.mongodb-version }} --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set primary did not become ready" >&2
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported MongoDB driver
        if: matrix.driver-version != 'locked'
        run: npm install --no-save --package-lock=false mongodb@6.0.0

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: npm test

      - name: Stop MongoDB
        if: always()
        run: docker rm -f mongodb >/dev/null 2>&1 || true
